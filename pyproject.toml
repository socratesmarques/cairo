[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairo-assistant"
version = "0.8.0"
description = "Cairo: modular local personal AI workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
desktop = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]

[project.scripts]
cairo = "cairo.__main__:main"
cairo-desktop = "cairo.desktop:main"

[tool.setuptools.packages.find]
include = ["cairo*"]

[tool.setuptools.package-data]
"cairo.web" = ["*.html", "*.css", "*.js"]
"cairo.skills" = ["*.md", "**/*.md"]

"cairo.config" = ["*.json"]
